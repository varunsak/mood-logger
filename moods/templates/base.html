<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Mood Logger{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.12.0/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-xl font-semibold text-sky-600">Mood Logger</a>
      <div class="space-x-3">
        <a href="{% url 'dashboard' %}" class="text-slate-700 hover:text-sky-600">Dashboard</a>
        <a href="{% url 'add_mood' %}" class="text-slate-700 hover:text-sky-600">Add</a>
        <a href="{% url 'graphs' %}" class="text-slate-700 hover:text-sky-600">Analytics</a>
        {% if user.is_authenticated %}
          <span class="ml-4 text-sm text-slate-500">{{ user.username }}</span>
          <a href="/logout/" class="ml-3 text-sm text-red-500">Logout</a>
        {% else %}
          <a href="/login/" class="ml-3 text-sm text-slate-700">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-sm text-slate-500">
    <div>© {{ now.year }} Mood Logger</div>
  </footer>
</body>
</html>
