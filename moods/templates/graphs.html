{% extends "base.html" %}
{% block title %}Analytics - Mood Logger{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow max-w-4xl mx-auto">
    <h2 class="text-2xl font-semibold mb-6 text-center">Weekly Sleep & Stress Overview</h2>

    <div class="chart-container mb-8">
        <h3 class="text-lg font-medium mb-2">Sleep Hours</h3>
        <canvas id="sleepChart" class="w-full"></canvas>
    </div>

    <div class="chart-container mb-8">
        <h3 class="text-lg font-medium mb-2">Stress Levels</h3>
        <canvas id="stressChart" class="w-full"></canvas>
    </div>

    <div class="chart-container mb-8">
        <h3 class="text-lg font-medium mb-2">Productivity Levels</h3>
        <canvas id="productivityChart" class="w-full"></canvas>
    </div>

    <div class="chart-container mb-8">
        <h3 class="text-lg font-medium mb-2">Mood Distribution</h3>
        <canvas id="moodChart" class="w-full"></canvas>
    </div>

    <div class="flex justify-between mt-6">
        <a href="{% url 'add_mood' %}" class="bg-sky-600 text-white px-4 py-2 rounded hover:bg-sky-700">Add Mood</a>
        <a href="{% url 'dashboard' %}" class="text-slate-600 hover:underline">Back to Dashboard</a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartData = JSON.parse('{{ data|escapejs }}');

    const sleepLabels = chartData.dates;
    const sleepData = chartData.sleepData;
    const stressLabels = chartData.dates;
    const stressData = chartData.stressData;
    const productivityData = chartData.productivityData;
    const productivityLabels = chartData.dates;
    const moods = chartData.moods;
    const moodLabels = chartData.moodCounts;

    new Chart(document.getElementById('sleepChart'), {
        type: 'line',
        data: {
            labels: sleepLabels,
            datasets: [{
                label: 'Sleep Hours',
                data: sleepData,
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    new Chart(document.getElementById('stressChart'), {
        type: 'line',
        data: {
            labels: stressLabels,
            datasets: [{
                label: 'Stress Level',
                data: stressData,
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    new Chart(document.getElementById('productivityChart'),{
        type: 'line',
        data: {
            labels: productivityLabels,
            datasets: [{
                label: 'Productivity',
                data: productivityData,
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    new Chart(document.getElementById('moodChart'),{
        type: 'bar',
        data: {
            labels: moods,
            datasets: [{
                label: 'Mood Count',
                data: moodLabels,
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
