{% extends "base.html" %}
{% block title %}Add Mood - Mood Logger{% endblock %}

{% block content %}
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-semibold mb-4">Add Mood</h2>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-slate-700">Mood</label>
        <select name="mood" class="mt-1 block w-full border rounded p-2">
          <option>Happy</option>
          <option>Neutral</option>
          <option>Sad</option>
          <option>Anxious</option>
          <option>Angry</option>
          <option>Excited</option>
          <option>Tired</option>
        </select>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700">Stress (0-10)</label>
          <input type="number" name="stress_level" placeholder="Stress (1-10)" min="0" max="10" class="mt-1 block w-full border rounded p-2"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700">Sleep Hours</label>
          <input type="number" step="0.1" name="sleep_hours" placeholder="Sleep Hours" min="0" max="24" class="mt-1 block w-full border rounded p-2"/>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Productivity (0-10)</label>
        <input type="number" name="productivity" min="0" max="10" class="mt-1 block w-full border rounded p-2"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Note (optional)</label>
        <textarea name="note" rows="4" class="mt-1 block w-full border rounded p-2"></textarea>
      </div>

      <div class="flex items-center gap-3">
        <button type="submit" class="bg-sky-600 text-white px-4 py-2 rounded hover:bg-sky-700">Save</button>
        <a href="{% url 'dashboard' %}" class="text-slate-600 hover:underline">Back to Dashboard</a>
      </div>
    </form>
  </div>
{% endblock %}
